<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BizTradingHub — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d0c; --panel: #121713; --panel-2: #161d18; --line: #212b24; --ink: #edf2ee;
    --dim: #7f9188; --amber: #dda45b; --up: #38ba7c; --down: #e0685a;
    --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'Fraunces', Georgia, serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono);}
  body{padding:32px 20px 80px;}
  main{max-width:640px; margin:0 auto;}
  h1{font-family:var(--serif); font-weight:600; font-size:24px; margin:0 0 4px;}
  h1 em{color:var(--amber); font-style:normal; font-weight:400;}
  .sub{color:var(--dim); font-size:12px; margin-bottom:26px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px;}
  label{display:block; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:0 0 6px;}
  input{
    width:100%; padding:9px 11px; background:var(--bg); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); font-family:var(--mono); font-size:13px;
  }
  input:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
  button{
    padding:9px 16px; background:var(--amber); color:var(--bg); border:none;
    border-radius:6px; font-family:var(--mono); font-weight:600; font-size:12px; cursor:pointer;
  }
  button:hover{opacity:0.9;}
  button.danger{background:transparent; color:var(--down); border:1px solid var(--down); font-weight:500;}
  .row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .row > div{flex:1; min-width:140px;}
  .error{color:var(--down); font-size:12px; margin-top:10px;}
  .ok{color:var(--up); font-size:12px; margin-top:10px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; padding:8px 6px; border-bottom:1px solid var(--line);}
  td{padding:10px 6px; border-bottom:1px solid var(--line);}
  tr:hover td{background:var(--panel-2);}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px;}
  .dot.on{background:var(--up);}
  .dot.off{background:var(--dim);}
  .empty{color:var(--dim); font-size:13px; padding:16px 6px;}

  #gate{max-width:340px; margin:80px auto;}
  #gate input{margin-bottom:12px;}
  #adminApp{display:none;}
</style>
</head>
<body>

<div id="gate" class="panel">
  <h1>Biz<em>TradingHub</em> admin</h1>
  <div class="sub">Enter the admin password to manage friend accounts.</div>
  <label for="adminPw">Admin password</label>
  <input id="adminPw" type="password" />
  <button id="gateBtn" style="width:100%;">Enter</button>
  <div class="error" id="gateError"></div>
</div>

<main id="adminApp">
  <h1>Biz<em>TradingHub</em> admin</h1>
  <div class="sub">See who's using the site and remove anyone you don't want to have access.</div>

  <div class="panel">
    <label>Add a friend</label>
    <div class="row">
      <div>
        <input id="newUsername" placeholder="username" />
      </div>
      <div>
        <input id="newPassword" placeholder="password" />
      </div>
      <button id="addBtn">Add</button>
    </div>
    <div class="error" id="addError"></div>
    <div class="ok" id="addOk"></div>
  </div>

  <div class="panel">
    <label style="margin-bottom:14px;">Accounts</label>
    <table>
      <thead><tr><th>User</th><th>Status</th><th>IP</th><th>Last seen</th><th></th></tr></thead>
      <tbody id="userRows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
let ADMIN_PW = '';

function timeAgo(ts){
  if (!ts) return 'never';
  const secs = (Date.now()/1000) - ts;
  if (secs < 60) return 'just now';
  if (secs < 3600) return Math.floor(secs/60) + 'm ago';
  if (secs < 86400) return Math.floor(secs/3600) + 'h ago';
  return Math.floor(secs/86400) + 'd ago';
}

async function loadUsers(){
  const tbody = document.getElementById('userRows');
  try{
    const res = await fetch('/api/admin/users', { headers: { 'X-Admin-Password': ADMIN_PW } });
    if (!res.ok) throw new Error('failed');
    const users = await res.json();
    if (!users.length){ tbody.innerHTML = '<tr><td colspan="5" class="empty">No accounts yet — add one above.</td></tr>'; return; }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${u.username}</td>
        <td><span class="dot ${u.online ? 'on' : 'off'}"></span>${u.online ? 'online' : 'offline'}</td>
        <td style="color:var(--dim); font-size:12px;">${u.ip || '—'}</td>
        <td style="color:var(--dim);">${timeAgo(u.last_seen)}</td>
        <td><button class="danger" data-user="${u.username}">Remove</button></td>
      </tr>
    `).join('');
    tbody.querySelectorAll('button[data-user]').forEach(btn => {
      btn.addEventListener('click', () => removeUser(btn.dataset.user));
    });
  }catch(e){
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Couldn\'t load accounts.</td></tr>';
  }
}

async function removeUser(username){
  if (!confirm(`Remove ${username}? They'll be logged out immediately.`)) return;
  await fetch('/api/admin/remove_user', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Password': ADMIN_PW },
    body: JSON.stringify({ username }),
  });
  loadUsers();
}

document.getElementById('addBtn').addEventListener('click', async () => {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const errEl = document.getElementById('addError');
  const okEl = document.getElementById('addOk');
  errEl.textContent = ''; okEl.textContent = '';
  if (!username || !password){ errEl.textContent = 'Enter a username and password.'; return; }
  try{
    const res = await fetch('/api/admin/add_user', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Password': ADMIN_PW },
      body: JSON.stringify({ username, password }),
    });
    if (res.ok){
      okEl.textContent = `Added ${username}.`;
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      loadUsers();
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.detail || 'Could not add user.';
    }
  }catch(e){
    errEl.textContent = 'Could not reach the server.';
  }
});

document.getElementById('gateBtn').addEventListener('click', async () => {
  const pw = document.getElementById('adminPw').value;
  const errEl = document.getElementById('gateError');
  errEl.textContent = '';
  const res = await fetch('/api/admin/users', { headers: { 'X-Admin-Password': pw } });
  if (res.ok){
    ADMIN_PW = pw;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('adminApp').style.display = 'block';
    loadUsers();
    setInterval(loadUsers, 8000);
  } else {
    errEl.textContent = 'Wrong admin password.';
  }
});
document.getElementById('adminPw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('gateBtn').click();
});
</script>
</body>
</html>
